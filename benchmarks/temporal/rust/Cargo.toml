[package]
name = "formatjs_temporal_rs_benchmark"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "placeholder.rs"

[dependencies]
temporal_rs = { version = "=0.2.6", default-features = false }
timezone_provider = { version = "=0.2.6", default-features = false }
# Match the ICU4X calendar data used by FormatJS generators.
icu_calendar = { version = "=2.3.0", default-features = false, features = [
  "compiled_data",
] }
writeable = "=0.6.4"
