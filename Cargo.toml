[workspace]
members = [
  "crates/intl_data",
  "crates/intl_data_build",
  "crates/intl_getcanonicallocales",
  "crates/intl_supportedvaluesof",
  "crates/intl_locale",
  "crates/intl_pluralrules",
  "crates/intl_listformat",
  "crates/intl_displaynames",
  "crates/intl_segmenter",
  "crates/intl_collator",
  "crates/intl_numberformat",
  "crates/intl_relativetimeformat",
  "crates/intl_datetimeformat",
  "crates/intl_datetimeformat_calendars",
  "crates/intl_hermes",
  "crates/icu_skeleton_parser",
  "crates/icu_messageformat_parser",
  "crates/icu_messageformat",
  "crates/icu_skeleton_parser_python",
  "crates/icu_messageformat_parser_python",
  "crates/icu_messageformat_python",
  "crates/intl_python",
  "crates/formatjs_intl_macros",
  "crates/formatjs_intl",
  "crates/formatjs_cli",
  "crates/formatjs_cli_napi",
  "packages/icu-messageformat-parser/integration-tests",
]
resolver = "3"

[workspace.dependencies]
ciborium = "0.2.2"
pretty_assertions = "1.4"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
pythonize = "0.29.0"
base64 = "0.23"
icu_locale = "2.1"
icu_plurals = "2.1"
sha2 = "0.11"
icu = "2.1"
icu_provider = "2.1"
icu_provider_adapters = "2.1"
icu_provider_blob = "2.1"
serde_json = "1.0"
fixed_decimal = "0.7"
napi = "3.8.6"
napi-derive = "3.5.4"
quote = "1.0"
syn = "3.0"
once_cell = "1.21"
regex = "1.12"
serde = "1.0"
indexmap = "2.12"
criterion = "0.8"
clap = "4.5"
anyhow = "1.0"
fast-glob = "1.0"
walkdir = "2"
oxc = "0.154"
oxc_allocator = "0.154"
oxc_ast = "0.154"
oxc_data_structures = "0.154"
oxc_parser = "0.154"
oxc_span = "0.154"
oxc_ecmascript = { version = "0.154", features = ["constant_evaluation"] }
oxc_syntax = "0.154"
sha1 = "0.11"
md-5 = "0.11"
hex = "0.4"
rayon = "1.12"
proc-macro2 = "1.0"
tempfile = "3.0"
