<!doctype html>
<script src="fixtures.js"></script>
<pre id="result"></pre>
<script>
  const max = 8_640_000_000_000_000
  const millis = 1_000_000n
  const result = {
    browser: navigator.userAgent,
    zones: {bound: 0, unsupported: [], nativeUnsupported: []},
    checks: {finiteOrRepresentative: 0, endpoints: 0, nativeTransitions: 0},
    errors: {intl: 0, temporal: 0},
    mismatches: [],
  }
  const problem = (kind, ...detail) => {
    result.errors[kind]++
    if (result.mismatches.length < 30) result.mismatches.push([kind, ...detail])
  }
  const formatter = timeZone =>
    new Intl.DateTimeFormat('en-US-u-ca-iso8601-nu-latn', {
      timeZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hourCycle: 'h23',
      timeZoneName: 'longOffset',
    })
  const offsetAt = (formatter, t) => {
    const name = formatter
      .formatToParts(t)
      .find(part => part.type === 'timeZoneName').value
    if (name === 'GMT') return 0
    const match = /^GMT([+-])(\d{2}):(\d{2})(?::(\d{2}))?$/.exec(name)
    if (!match) throw new Error('Unexpected UTC offset ' + name)
    return (
      (match[1] === '-' ? -1 : 1) *
      (Number(match[2]) * 3600 +
        Number(match[3]) * 60 +
        Number(match[4] || 0)) *
      1000
    )
  }
  const verifyProjectedWindows = projections => {
    const projected = {
      zones: 0,
      nativeZones: 0,
      offsets: 0,
      next: 0,
      previous: 0,
      mismatches: [],
    }
    const verifyWindow = (id, lo, hi, times, direction) => {
      const next = direction === 'next'
      const lower = BigInt(lo) * millis
      const upper = BigInt(hi) * millis
      const query = next ? (lo === -max ? lower : lower - 1n) : upper + 1n
      let point = new Temporal.ZonedDateTime(query, id)
      for (const t of next ? times : times.toReversed()) {
        const observed = point.getTimeZoneTransition(direction)
        projected[direction]++
        if (!observed || observed.epochNanoseconds !== BigInt(t) * millis) {
          projected.mismatches.push([
            id,
            direction,
            t,
            observed?.epochMilliseconds,
          ])
          return
        }
        point = observed
      }
      const extra = point.getTimeZoneTransition(direction)
      projected[direction]++
      if (
        extra &&
        (next
          ? extra.epochNanoseconds <= upper
          : extra.epochNanoseconds >= lower)
      )
        projected.mismatches.push([
          id,
          direction,
          lo,
          hi,
          extra.epochMilliseconds,
        ])
    }
    for (const {id, lower, upper, lo, hi, expected} of projections) {
      const fmt = formatter(id)
      projected.zones++
      for (const [epoch, offset] of [...lower, ...upper]) {
        const actual = offsetAt(fmt, epoch)
        projected.offsets++
        if (actual !== offset)
          projected.mismatches.push([id, epoch, offset, actual])
      }
      try {
        new Temporal.ZonedDateTime(0n, id)
      } catch {
        continue
      }
      projected.nativeZones++
      for (const direction of ['next', 'previous']) {
        verifyWindow(id, lower[0][0], lower.at(-1)[0], [], direction)
        verifyWindow(id, lo, hi, expected, direction)
      }
    }
    return projected
  }
  for (const {id, cut, expectedBoundaries, endpoints} of globalThis.fixtures ??
    []) {
    let fmt
    try {
      fmt = formatter(id)
    } catch {
      result.zones.unsupported.push(id)
      continue
    }
    result.zones.bound++
    for (const [t, before, after] of expectedBoundaries) {
      for (const [ms, offset] of [
        [t - 1, before],
        [t, after],
      ]) {
        const observed = offsetAt(fmt, ms)
        result.checks.finiteOrRepresentative++
        if (observed !== offset) problem('intl', id, ms, offset, observed)
      }
    }
    for (const [t, offset] of endpoints) {
      const observed = offsetAt(fmt, t)
      result.checks.endpoints++
      if (observed !== offset) problem('intl', id, t, offset, observed)
    }
    let zoned
    try {
      zoned = new Temporal.ZonedDateTime(-BigInt(max) * millis, id)
    } catch {
      result.zones.nativeUnsupported.push(id)
      continue
    }
    let skip = false
    for (const [t, before, after] of expectedBoundaries) {
      if (before === after) continue
      const next = zoned.getTimeZoneTransition('next')
      result.checks.nativeTransitions++
      if (!next || next.epochNanoseconds !== BigInt(t) * millis) {
        problem('temporal', id, t, next ? next.epochMilliseconds : null)
        skip = true
        break
      }
      zoned = next
    }
    if (skip) continue
    const extra = zoned.getTimeZoneTransition('next')
    result.checks.nativeTransitions++
    if (extra && extra.epochNanoseconds <= BigInt(cut) * millis)
      problem(
        'temporal',
        id,
        'unexpected before cutoff',
        cut,
        extra.epochMilliseconds
      )
  }
  document.querySelector('#result').textContent = JSON.stringify(
    globalThis.projections
      ? verifyProjectedWindows(globalThis.projections)
      : result
  )
</script>
