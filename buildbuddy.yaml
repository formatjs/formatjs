actions:
  - name: 'Test all targets'
    container_image: 'ubuntu-20.04'
    triggers:
      push:
        branches:
          - 'main'
          - 'gh-readonly-queue/*'
      pull_request:
        branches:
          - 'main'
    resource_requests:
      memory: 10GB
      disk: 32GB
    bazel_commands:
      - 'test --config=bb-workflow --remote_download_minimal //...'

  - name: 'Cross-build Release Artifacts'
    container_image: 'ubuntu-20.04'
    triggers:
      push:
        branches:
          - 'main'
          - 'gh-readonly-queue/*'
      pull_request:
        branches:
          - 'main'
    resource_requests:
      memory: 10GB
      disk: 64GB
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file
      - run: 'bash .github/scripts/cross-build-smoke.sh'
