actions:
  - name: 'Test all targets'
    container_image: 'ubuntu-20.04'
    triggers:
      push:
        branches:
          - 'main'
          - 'gh-readonly-queue/*'
      pull_request:
        branches:
          - 'main'
          - 'codex/*'
    resource_requests:
      memory: 16GB
      disk: 32GB
    bazel_commands:
      - 'test --config=bb-workflow --remote_download_minimal //...'

  - name: 'Verify hooks'
    container_image: 'ubuntu-24.04'
    triggers:
      push:
        branches:
          - 'main'
          - 'gh-readonly-queue/*'
      pull_request:
        branches:
          - 'main'
          - 'codex/*'
    resource_requests:
      memory: 16GB
      disk: 32GB
    steps:
      - run: |
          set -euo pipefail
          # Hook subprocesses do not retain the runner's injected Bazel startup flags.
          : "${BUILDBUDDY_API_KEY:?Trusted BuildBuddy credentials are required}"
          umask 077
          printf '%s\n' \
            'build --config=bb-workflow' \
            'build --remote_download_toplevel' \
            "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" > .bazelrc.user
          JS_BINARY__CHDIR="$PWD" bazel run -c opt //:lefthook -- run pre-commit --all-files
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Pre-commit hooks changed files. Run hooks locally and commit the changes.' >&2
            git diff HEAD
            git status --short
            exit 1
          fi

  - name: 'Cross-build Release Artifacts'
    container_image: 'ubuntu-20.04'
    triggers:
      push:
        branches:
          - 'main'
          - 'gh-readonly-queue/*'
      pull_request:
        branches:
          - 'main'
          - 'codex/*'
    resource_requests:
      memory: 10GB
      disk: 64GB
    env:
      SMOKE_ARTIFACTS_DIR: '/tmp/formatjs-release-smoke'
    steps:
      # Install inspection tools.
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file

      # Cross-build release binaries and native packages.
      - run: |
          bazel build --config=bb-cross-build \
            //crates/formatjs_cli:release_binary_darwin_arm64 \
            //crates/formatjs_cli:release_binary_linux_x64 \
            //crates/formatjs_cli:release_binary_linux_arm64 \
            //crates/formatjs_cli:release_binary_windows_x64 \
            //packages/cli-native-darwin-arm64:pkg \
            //packages/cli-native-win32-x64:pkg \
            //packages/cli-native-linux-x64-musl:pkg \
            //packages/cli-native-linux-arm64-musl:pkg \
            //packages/cli-native-linux-x64:pkg \
            //packages/cli-native-linux-arm64:pkg

      # Collect outputs; cquery resolves transitioned paths.
      - run: |
          set -euo pipefail
          rm -rf "$SMOKE_ARTIFACTS_DIR"
          mkdir -p "$SMOKE_ARTIFACTS_DIR"
          for package in cli-native-darwin-arm64 cli-native-win32-x64 \
            cli-native-linux-x64-musl cli-native-linux-arm64-musl \
            cli-native-linux-x64 cli-native-linux-arm64; do
            mkdir -p "$SMOKE_ARTIFACTS_DIR/$package"
            package_dir=$(bazel cquery --config=bb-cross-build --output=files "//packages/$package:pkg" | tail -n 1)
            cp -RL "$package_dir"/. "$SMOKE_ARTIFACTS_DIR/$package/"
          done
          cp "$(bazel cquery --config=bb-cross-build --output=files //crates/formatjs_cli:release_binary_darwin_arm64 | tail -n 1)" "$SMOKE_ARTIFACTS_DIR/formatjs_cli-darwin-arm64"
          cp "$(bazel cquery --config=bb-cross-build --output=files //crates/formatjs_cli:release_binary_windows_x64 | tail -n 1)" "$SMOKE_ARTIFACTS_DIR/formatjs_cli-win32-x64.exe"
          for arch in x64 arm64; do
            binary=$(bazel cquery --config=bb-cross-build --output=files "//crates/formatjs_cli:release_binary_linux_$arch" | tail -n 1)
            cp "$binary" "$SMOKE_ARTIFACTS_DIR/cli-native-linux-$arch-musl/formatjs_cli"
          done

      # Check macOS and Windows binary formats.
      - run: |
          set -euo pipefail
          file "$SMOKE_ARTIFACTS_DIR/formatjs_cli-darwin-arm64" | grep -E 'Mach-O 64-bit.*arm64'
          file "$SMOKE_ARTIFACTS_DIR/cli-native-darwin-arm64/formatjs_cli_napi.node" | grep -E 'Mach-O 64-bit.*arm64.*shared library'
          file "$SMOKE_ARTIFACTS_DIR/formatjs_cli-win32-x64.exe" | grep -E 'PE32[+].*[(]console[)].*x86-64'
          file "$SMOKE_ARTIFACTS_DIR/cli-native-win32-x64/formatjs_cli_napi.node" | grep -E 'PE32[+].*[(]DLL[)].*x86-64'

      # Check Linux architectures and static CLI linkage.
      - run: |
          set -euo pipefail
          for arch in x64 arm64; do
            package_dir="$SMOKE_ARTIFACTS_DIR/cli-native-linux-$arch-musl"
            machine='x86-64'
            if [[ "$arch" == arm64 ]]; then machine='ARM aarch64'; fi
            file "$package_dir/formatjs_cli" | grep -F "$machine"
            file "$package_dir/formatjs_cli_napi.node" | grep -F "$machine"
            if readelf -l "$package_dir/formatjs_cli" | grep 'INTERP' >/dev/null ||
              readelf -d "$package_dir/formatjs_cli" | grep '(NEEDED)' >/dev/null; then
              echo "Linux release CLI must be a static musl binary" >&2
              exit 1
            fi
            readelf -d "$package_dir/formatjs_cli_napi.node" | grep '(NEEDED)'
            for stdlib in $(readelf -d "$package_dir/formatjs_cli_napi.node" | sed -n 's/.*\[\(libstd-[^]]*\.so\)\].*/\1/p'); do
              if [[ ! -f "$package_dir/$stdlib" ]]; then
                echo "Missing Rust runtime library: $stdlib" >&2
                exit 1
              fi
            done
          done

      # Check addon initialization and unwind symbols.
      - run: |
          set -euo pipefail
          for arch in x64 arm64; do
            if nm -a "$SMOKE_ARTIFACTS_DIR/cli-native-linux-$arch-musl/formatjs_cli_napi.node" | grep 'init_have_lse_atomics' >/dev/null; then
              echo "musl addon must not initialize outline atomics during dlopen" >&2
              exit 1
            fi
            if nm -D --undefined-only "$SMOKE_ARTIFACTS_DIR/cli-native-linux-$arch/formatjs_cli_napi.node" | grep '_Unwind_'; then
              echo "glibc addon must not leave unwind symbols undefined" >&2
              exit 1
            fi
          done

      # Smoke-test the Linux x64 CLI.
      - run: |
          set -euo pipefail
          binary="$SMOKE_ARTIFACTS_DIR/cli-native-linux-x64-musl/formatjs_cli"
          "$binary" --version
          "$binary" --help
          if strings "$binary" | grep 'GLIBC_' >/dev/null; then
            echo "Linux musl binary must not reference glibc symbols" >&2
            exit 1
          fi

      # Build and test the packaged SDK from a standalone consumer.
      - run: |
          set -euo pipefail
          bazel build --config=bb-cross-build --remote_download_toplevel //native/hermes/package:sdk
          mapfile -t sdk_archives < <(bazel cquery --config=bb-cross-build --remote_download_toplevel --output=files //native/hermes/package:sdk)
          if [[ ${#sdk_archives[@]} -ne 1 || "${sdk_archives[0]}" != *.tar.gz ]]; then
            echo "Expected one Hermes extension SDK archive" >&2
            exit 1
          fi
          cp "${sdk_archives[0]}" "$BUILDBUDDY_ARTIFACTS_DIRECTORY/formatjs-intl-getcanonicallocales-hermes.tar.gz"

          bazel build --config=bb-cross-build --remote_download_toplevel //native/hermes/package:apple_sdk
          apple_archive=$(bazel cquery --config=bb-cross-build --remote_download_toplevel --output=files //native/hermes/package:apple_sdk)
          apple_smoke_dir=$(mktemp -d)
          cp "$apple_archive" "$apple_smoke_dir/formatjs-hermes-intl-apple.tar.gz"
          mkdir "$apple_smoke_dir/apple-sdk-smoke"
          cp examples/hermes-apple-sdk/{.bazelrc,.bazelversion,MODULE.bazel,BUILD.bazel,main.cpp,smoke.sh} "$apple_smoke_dir/apple-sdk-smoke/"
          tar -czf "$BUILDBUDDY_ARTIFACTS_DIRECTORY/apple-sdk-smoke.tar.gz" -C "$apple_smoke_dir" .
          rm -rf "$apple_smoke_dir"

          sdk_dir=$(mktemp -d)
          sdk_smoke_dir=$(mktemp -d)
          trap 'rm -rf "$sdk_dir" "$sdk_smoke_dir"' EXIT
          tar -xzf "${sdk_archives[0]}" -C "$sdk_dir"
          cd examples/hermes-intl
          sdk_override="--override_module=formatjs_intl_getcanonicallocales_hermes=$sdk_dir"
          bazel test --config=bb-workflow "$sdk_override" //:smoke_test
          bazel build --config=bb-workflow "$sdk_override" --remote_download_toplevel //:smoke_macos_arm64 //:extension_bytecode
          mapfile -t macos_binaries < <(bazel cquery --config=bb-workflow "$sdk_override" --remote_download_toplevel --output=files //:smoke_macos_arm64)
          mapfile -t extension_bytecode < <(bazel cquery --config=bb-workflow "$sdk_override" --remote_download_toplevel --output=files //:extension_bytecode)
          if [[ ${#macos_binaries[@]} -ne 1 || ${#extension_bytecode[@]} -ne 1 ]]; then
            echo "Expected one Hermes consumer binary and one extension bytecode file" >&2
            exit 1
          fi
          cp "${macos_binaries[0]}" "$sdk_smoke_dir/hermes-intl-darwin-arm64"
          cp "${extension_bytecode[0]}" "$sdk_smoke_dir/hermes-intl-extension.hbc"
          file "$sdk_smoke_dir/hermes-intl-darwin-arm64" | grep -E 'Mach-O 64-bit.*arm64'
          tar -czf "$BUILDBUDDY_ARTIFACTS_DIRECTORY/hermes-extension-smoke.tar.gz" \
            -C "$sdk_smoke_dir" hermes-intl-darwin-arm64 hermes-intl-extension.hbc

      # Preserve the existing CLI archive for the trusted main-branch downloader.
      - run: |
          set -euo pipefail
          tar -czf "$BUILDBUDDY_ARTIFACTS_DIRECTORY/release-cross-build-smoke.tar.gz" -C "$SMOKE_ARTIFACTS_DIR" .
          rm -rf "$SMOKE_ARTIFACTS_DIR"
