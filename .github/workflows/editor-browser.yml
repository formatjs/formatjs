name: Editor browser tests

on:
  pull_request:
    paths:
      - 'packages/editor/**'
      - 'packages/react-intl/**'
      - 'packages/intl/**'
      - 'tools/**'
      - 'platforms/**'
      - 'MODULE.bazel*'
      - 'pnpm-lock.yaml'
      - '.bazelrc'
      - '.github/workflows/editor-browser.yml'
      - '.github/scripts/actiond-vrt.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check VM prerequisites
        run: |
          test -c /dev/kvm
          sudo modprobe vhost_vsock
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/kvm /dev/vhost-vsock
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: editor-browser
      - name: Interaction tests and VRT in Linux VM
        run: bash .github/scripts/actiond-vrt.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: editor-browser-results
          path: |
            bazel-testlogs/packages/editor/vrt/
            packages/editor/vrt/__screenshots__/
            ${{ runner.temp }}/formatjs-actiond/logs/
