name: Editor browser tests

on:
  pull_request:
    paths:
      - 'packages/editor/**'
      - 'packages/react-intl/**'
      - 'packages/intl/**'
      - 'tools/**'
      - 'platforms/**'
      - 'MODULE.bazel*'
      - 'pnpm-lock.yaml'
      - '.bazelrc'
      - '.github/workflows/editor-browser.yml'
      - '.github/scripts/actiond-vrt.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check VM prerequisites
        run: |
          test -c /dev/kvm
          sudo modprobe vhost_vsock
          test -c /dev/vhost-vsock
          sudo chmod a+rw /dev/kvm /dev/vhost-vsock
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: editor-browser
      - name: Interaction tests and VRT in Linux VM
        run: bash .github/scripts/actiond-vrt.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: editor-browser-results
          path: |
            bazel-testlogs/packages/editor/vrt/
            packages/editor/vrt/__screenshots__/
            ${{ runner.temp }}/formatjs-actiond/build.log
            ${{ runner.temp }}/formatjs-actiond/vm.log
