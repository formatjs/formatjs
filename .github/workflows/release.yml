name: Release

on:
  workflow_dispatch:
    inputs:
      npm_paths:
        description: 'JSON array of released package paths to publish'
        required: true
        default: '[]'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_native_packages:
    name: Cross-build Native Packages
    if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-darwin-arm64') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-win32-x64') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-native-packages
          repository-cache: true

      - name: Build Packages
        env:
          DARWIN_SELECTED: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-darwin-arm64') }}
          WINDOWS_SELECTED: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-win32-x64') }}
          LINUX_SELECTED: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
        run: |
          targets=()
          if [[ "$DARWIN_SELECTED" == "true" ]]; then
            targets+=(//packages/cli-native-darwin-arm64:pkg)
          fi
          if [[ "$WINDOWS_SELECTED" == "true" ]]; then
            targets+=(//packages/cli-native-win32-x64:pkg)
          fi
          if [[ "$LINUX_SELECTED" == "true" ]]; then
            targets+=(
              //packages/cli-native-linux-x64-musl:pkg
              //packages/cli-native-linux-arm64-musl:pkg
            )
          fi

          bazel build \
            --config=ci \
            --compilation_mode=opt \
            --remote_download_outputs=all \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            "${targets[@]}"

          copy_package() {
            local package=$1
            local package_dir
            package_dir=$(bazel cquery \
              --config=ci \
              --compilation_mode=opt \
              --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
              --output=files \
              "//packages/$package:pkg" | tail -n 1)
            mkdir -p "artifacts/$package"
            cp -R "$package_dir"/. "artifacts/$package/"
          }

          if [[ "$DARWIN_SELECTED" == "true" ]]; then
            copy_package cli-native-darwin-arm64
            artifact_info=$(file artifacts/cli-native-darwin-arm64/formatjs_cli_napi.node)
            echo "$artifact_info"
            [[ "$artifact_info" == *"Mach-O 64-bit"*"shared library"*"arm64"* ]] || {
              echo "Darwin native addon must be an arm64 Mach-O shared library"
              exit 1
            }
          fi

          if [[ "$WINDOWS_SELECTED" == "true" ]]; then
            copy_package cli-native-win32-x64
            artifact_info=$(file artifacts/cli-native-win32-x64/formatjs_cli_napi.node)
            echo "$artifact_info"
            [[ "$artifact_info" == *"PE32+"*"DLL"*"x86-64"* ]] || {
              echo "Windows native addon must be an x86-64 PE DLL"
              exit 1
            }
          fi

          if [[ "$LINUX_SELECTED" == "true" ]]; then
            for package in cli-native-linux-x64-musl cli-native-linux-arm64-musl; do
              copy_package "$package"
              artifact_info=$(file "artifacts/$package/formatjs_cli_napi.node")
              echo "$artifact_info"
              case "$package:$artifact_info" in
                cli-native-linux-x64-musl:*"x86-64"* | cli-native-linux-arm64-musl:*"ARM aarch64"*) ;;
                *)
                  echo "Linux native addon has wrong architecture"
                  exit 1
                  ;;
              esac
              case "$artifact_info" in
                *"static-pie linked"* | *"statically linked"*)
                  echo "musl Node addon must dynamically link libc"
                  exit 1
                  ;;
              esac
              if nm -a "artifacts/$package/formatjs_cli_napi.node" | grep 'init_have_lse_atomics' >/dev/null; then
                echo "musl Node addon must not run compiler-rt outline atomics init during dlopen"
                exit 1
              fi
            done
          fi

      - name: Upload Darwin Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-darwin-arm64') }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-darwin-arm64
          path: artifacts/cli-native-darwin-arm64
          retention-days: 7

      - name: Upload Windows Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-win32-x64') }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-win32-x64
          path: artifacts/cli-native-win32-x64
          retention-days: 7

      - name: Upload Linux x64 Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-linux-x64-musl
          path: artifacts/cli-native-linux-x64-musl
          retention-days: 7

      - name: Upload Linux arm64 Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-native-linux-arm64-musl
          path: artifacts/cli-native-linux-arm64-musl
          retention-days: 7

  smoke_darwin_arm64:
    name: Smoke-test Darwin arm64 Package
    needs: build_native_packages
    if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-darwin-arm64') }}
    runs-on: macos-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: cli-native-darwin-arm64
          path: artifacts/cli-native-darwin-arm64

      - name: Smoke Test Package
        run: |
          node -e 'const native = require(process.argv[1]); const formatters = native.supportedBuiltinFormatters(); if (!formatters.includes("default")) throw new Error("Missing default formatter"); const output = native.compileMessages([{id: "hello", message: "Hello {name}", sourceFile: "smoke.json"}], {}); if (!output.includes("\"hello\"")) throw new Error(output); console.log(output);' ./artifacts/cli-native-darwin-arm64

  smoke_windows_msvc:
    name: Smoke-test Windows MSVC Package
    needs: build_native_packages
    if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-win32-x64') }}
    runs-on: windows-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: cli-native-win32-x64
          path: artifacts/cli-native-win32-x64

      - name: Smoke Test Package
        run: |
          node -e 'const native = require(process.argv[1]); const formatters = native.supportedBuiltinFormatters(); if (!formatters.includes("default")) throw new Error("Missing default formatter"); const output = native.compileMessages([{id: "hello", message: "Hello {name}", sourceFile: "smoke.json"}], {}); if (!output.includes("\"hello\"")) throw new Error(output); console.log(output);' ./artifacts/cli-native-win32-x64

  smoke_linux_musl:
    name: Smoke-test Linux musl Package (${{ matrix.arch }})
    needs: build_native_packages
    if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') || contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            package: cli-native-linux-x64-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            package: cli-native-linux-arm64-musl

    steps:
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}
          path: artifacts/${{ matrix.package }}

      - name: Smoke Test Package
        run: |
          docker run --rm \
            -v "$PWD/artifacts/${{ matrix.package }}:/native:ro" \
            node:24-alpine \
            node -e 'const native = require("/native"); const formatters = native.supportedBuiltinFormatters(); if (!formatters.includes("default")) throw new Error("Missing default formatter"); const output = native.compileMessages([{id: "hello", message: "Hello {name}", sourceFile: "smoke.json"}], {}); if (!output.includes("\"hello\"")) throw new Error(output); console.log(output);'

  release:
    needs:
      - build_native_packages
      - smoke_darwin_arm64
      - smoke_linux_musl
      - smoke_windows_msvc
    if: ${{ always() && inputs.npm_paths != '[]' && (needs.build_native_packages.result == 'success' || needs.build_native_packages.result == 'skipped') && (needs.smoke_darwin_arm64.result == 'success' || needs.smoke_darwin_arm64.result == 'skipped') && (needs.smoke_windows_msvc.result == 'success' || needs.smoke_windows_msvc.result == 'skipped') && (needs.smoke_linux_musl.result == 'success' || needs.smoke_linux_musl.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Distribution
        run: |
          bazel build \
            --config=ci \
            --compilation_mode=opt \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
            :dist
          DIST_PATH=$(bazel cquery --config=ci --compilation_mode=opt --output=files :dist)
          echo "Distribution path: $DIST_PATH"
          cp -rf "$DIST_PATH" release/
          chmod -R +w release/

      - name: Download Windows Native Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-win32-x64') }}
        uses: actions/download-artifact@v8
        with:
          name: cli-native-win32-x64
          path: release/packages/cli-native-win32-x64

      - name: Download Darwin arm64 Native Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-darwin-arm64') }}
        uses: actions/download-artifact@v8
        with:
          name: cli-native-darwin-arm64
          path: release/packages/cli-native-darwin-arm64

      - name: Download Linux x64 musl Native Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-x64-musl') }}
        uses: actions/download-artifact@v8
        with:
          name: cli-native-linux-x64-musl
          path: release/packages/cli-native-linux-x64-musl

      - name: Download Linux arm64 musl Native Package
        if: ${{ contains(fromJSON(inputs.npm_paths), 'packages/cli-native-linux-arm64-musl') }}
        uses: actions/download-artifact@v8
        with:
          name: cli-native-linux-arm64-musl
          path: release/packages/cli-native-linux-arm64-musl

      - name: Prepare npm Package Manifests
        working-directory: release
        env:
          NPM_RELEASE_PATHS: ${{ inputs.npm_paths }}
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')

          const dependencyFields = [
            'dependencies',
            'optionalDependencies',
            'peerDependencies',
          ]
          const packageRoot = path.join(process.cwd(), 'packages')
          const packageJsonPaths = fs
            .readdirSync(packageRoot, {withFileTypes: true})
            .filter(entry => entry.isDirectory())
            .map(entry => path.join(packageRoot, entry.name, 'package.json'))
            .filter(file => fs.existsSync(file))
          const manifests = packageJsonPaths.map(file => ({
            file,
            packageJson: JSON.parse(fs.readFileSync(file, 'utf8')),
          }))
          const publishManifests = JSON.parse(
            process.env.NPM_RELEASE_PATHS || '[]'
          ).map(packagePath => {
            const file = path.join(process.cwd(), packagePath, 'package.json')
            const manifest = manifests.find(manifest => manifest.file === file)
            if (!manifest) {
              throw new Error(`Missing release package manifest: ${file}`)
            }
            return manifest
          })
          const packageVersions = new Map(
            manifests.map(({packageJson}) => [
              packageJson.name,
              packageJson.version,
            ])
          )
          let replacements = 0

          for (const {file, packageJson} of publishManifests) {
            let changed = false

            for (const field of dependencyFields) {
              const dependencies = packageJson[field]
              if (
                !dependencies ||
                typeof dependencies !== 'object' ||
                Array.isArray(dependencies)
              ) {
                continue
              }

              for (const [name, specifier] of Object.entries(dependencies)) {
                if (
                  typeof specifier !== 'string' ||
                  !specifier.startsWith('workspace:')
                ) {
                  continue
                }
                if (specifier !== 'workspace:*') {
                  throw new Error(
                    `${file} uses unsupported workspace dependency range ${name}@${specifier}`
                  )
                }

                const packageVersion = packageVersions.get(name)
                if (!packageVersion) {
                  throw new Error(
                    `${file} references missing workspace package ${name}`
                  )
                }

                dependencies[name] = packageVersion
                replacements += 1
                changed = true
              }
            }

            if (changed) {
              fs.writeFileSync(file, JSON.stringify(packageJson, null, 2) + '\n')
            }
          }

          console.log(`Prepared ${replacements} workspace dependency version(s).`)
          JS

      - name: Publish released npm packages
        working-directory: release
        env:
          NPM_RELEASE_PATHS: ${{ inputs.npm_paths }}
        run: |
          mapfile -t package_paths < <(
            node -e 'JSON.parse(process.env.NPM_RELEASE_PATHS || "[]").forEach(path => console.log(path))'
          )

          if [ "${#package_paths[@]}" -eq 0 ]; then
            echo "No npm package releases to publish."
            exit 0
          fi

          for package_path in "${package_paths[@]}"; do
            if [ ! -d "$package_path" ]; then
              echo "::error::Release package path does not exist in Bazel distribution: $package_path"
              exit 1
            fi

            package_spec="$(
              node -e 'const pkg = require(`./${process.argv[1]}/package.json`); process.stdout.write(`${pkg.name}@${pkg.version}`)' "$package_path"
            )"
            if npm view "$package_spec" version --json >/dev/null 2>&1; then
              echo "Skipping already published $package_spec"
              continue
            fi

            echo "Publishing $package_spec"
            if (cd "$package_path" && pnpm publish --access public --no-git-checks); then
              continue
            fi

            # A concurrent or partially completed run may have published it.
            if npm view "$package_spec" version --json >/dev/null 2>&1; then
              echo "Skipping concurrently published $package_spec"
              continue
            fi

            exit 1
          done
