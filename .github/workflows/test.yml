name: Test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build Hermetic Timezone Data
        run: bazel build //packages/intl-datetimeformat:tz_data_generated

      - name: Run Tests
        run: |
          if [ -n "${{ secrets.BUILDBUDDY_ORG_API_KEY }}" ]; then
            echo "Running with BuildBuddy ci config"
            bazel test --config=ci --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} //...
          else
            echo "Running without BuildBuddy (no API key)"
            bazel test //...
          fi

      - name: Rust CLI Smoke Test
        run: |
          if [ -n "${{ secrets.BUILDBUDDY_ORG_API_KEY }}" ]; then
            bazel build \
              --config=ci \
              --compilation_mode=opt \
              --remote_download_outputs=all \
              --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }} \
              //crates/formatjs_cli
          else
            bazel build --compilation_mode=opt //crates/formatjs_cli
          fi
          BINARY_PATH=bazel-bin/crates/formatjs_cli/formatjs_cli
          $BINARY_PATH --version
          $BINARY_PATH --help

  examples:
    name: Examples (${{ matrix.example }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - rescripts
          - strict-locale-type
          - strict-message-types

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-examples-${{ matrix.example }}
          repository-cache: true

      - name: Build Example
        working-directory: examples/${{ matrix.example }}
        run: bazel build //...

      - name: Test Example
        working-directory: examples/${{ matrix.example }}
        run: bazel test //...

  linux_musl_smoke:
    name: Linux musl Smoke Tests (${{ matrix.arch }})
    needs: release_cross_build
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            package: cli-native-linux-x64-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            package: cli-native-linux-arm64-musl

    steps:
      - name: Download Linux musl Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-cross-build-smoke
          path: artifacts

      - name: Smoke Test Static musl CLI On GNU
        run: |
          chmod +x artifacts/${{ matrix.package }}/formatjs_cli
          artifacts/${{ matrix.package }}/formatjs_cli --version
          artifacts/${{ matrix.package }}/formatjs_cli --help

      - name: Smoke Test Package In Alpine
        run: |
          docker run --rm \
            -v "$PWD/artifacts/${{ matrix.package }}:/native:ro" \
            node:24-alpine \
            node -e 'const native = require("/native"); const formatters = native.supportedBuiltinFormatters(); if (!formatters.includes("default")) throw new Error("Missing default formatter"); const output = native.compileMessages([{id: "hello", message: "Hello {name}", sourceFile: "smoke.json"}], {}); if (!output.includes("\"hello\"")) throw new Error(output); console.log(output);'

  release_cross_build:
    name: Cross-build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-release-cross-build
          repository-cache: true

      - name: Build Release Artifacts
        run: |
          bazel_build_args=(--compilation_mode=opt)
          bazel_query_args=(--compilation_mode=opt)

          if [ -n "${{ secrets.BUILDBUDDY_ORG_API_KEY }}" ]; then
            bazel_build_args+=(
              --config=ci
              --remote_download_outputs=all
              --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
            )
            bazel_query_args+=(
              --config=ci
              --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
            )
          fi

          bazel build "${bazel_build_args[@]}" \
            //crates/formatjs_cli:release_binary_darwin_arm64 \
            //crates/formatjs_cli:release_binary_linux_x64 \
            //crates/formatjs_cli:release_binary_linux_arm64 \
            //crates/formatjs_cli:release_binary_windows_x64 \
            //packages/cli-native-darwin-arm64:pkg \
            //packages/cli-native-linux-x64-musl:pkg \
            //packages/cli-native-linux-arm64-musl:pkg \
            //packages/cli-native-win32-x64:pkg

          darwin_path=$(bazel cquery "${bazel_query_args[@]}" --output=files //crates/formatjs_cli:release_binary_darwin_arm64 | tail -n 1)
          darwin_package_dir=$(bazel cquery "${bazel_query_args[@]}" --output=files //packages/cli-native-darwin-arm64:pkg | tail -n 1)
          windows_path=$(bazel cquery "${bazel_query_args[@]}" --output=files //crates/formatjs_cli:release_binary_windows_x64 | tail -n 1)
          windows_package_dir=$(bazel cquery "${bazel_query_args[@]}" --output=files //packages/cli-native-win32-x64:pkg | tail -n 1)
          mkdir -p artifacts/cli-native-darwin-arm64 artifacts/cli-native-win32-x64
          cp "$darwin_path" artifacts/formatjs_cli-darwin-arm64
          cp -R "$darwin_package_dir"/. artifacts/cli-native-darwin-arm64/
          cp "$windows_path" artifacts/formatjs_cli-win32-x64.exe
          cp -R "$windows_package_dir"/. artifacts/cli-native-win32-x64/

          for arch in x64 arm64; do
            package="cli-native-linux-$arch-musl"
            package_dir=$(bazel cquery "${bazel_query_args[@]}" --output=files "//packages/$package:pkg" | tail -n 1)
            binary_path=$(bazel cquery "${bazel_query_args[@]}" --output=files "//crates/formatjs_cli:release_binary_linux_$arch" | tail -n 1)
            mkdir -p "artifacts/$package"
            cp -R "$package_dir"/. "artifacts/$package/"
            cp "$binary_path" "artifacts/$package/formatjs_cli"
          done

          darwin_info=$(file artifacts/formatjs_cli-darwin-arm64)
          darwin_addon_info=$(file artifacts/cli-native-darwin-arm64/formatjs_cli_napi.node)
          binary_info=$(file artifacts/formatjs_cli-win32-x64.exe)
          addon_info=$(file artifacts/cli-native-win32-x64/formatjs_cli_napi.node)
          echo "$darwin_info"
          echo "$darwin_addon_info"
          echo "$binary_info"
          echo "$addon_info"
          case "$darwin_info" in
            *"Mach-O 64-bit"*"arm64"*) ;;
            *)
              echo "Darwin CLI must be an arm64 Mach-O executable"
              exit 1
              ;;
          esac
          [[ "$darwin_addon_info" == *"Mach-O 64-bit"* && "$darwin_addon_info" == *"shared library"* && "$darwin_addon_info" == *"arm64"* ]] || {
            echo "Darwin native addon must be an arm64 Mach-O shared library"
            exit 1
          }
          case "$binary_info" in
            *"PE32+"*"console"*"x86-64"*) ;;
            *)
              echo "Windows CLI must be an x86-64 PE console executable"
              exit 1
              ;;
          esac
          case "$addon_info" in
            *"PE32+"*"DLL"*"x86-64"*) ;;
            *)
              echo "Windows native addon must be an x86-64 PE DLL"
              exit 1
              ;;
          esac

          for package in cli-native-linux-x64-musl cli-native-linux-arm64-musl; do
            artifact_info=$(file "artifacts/$package/formatjs_cli_napi.node")
            binary_info=$(file "artifacts/$package/formatjs_cli")
            echo "$artifact_info"
            echo "$binary_info"
            case "$package:$artifact_info" in
              cli-native-linux-x64-musl:*"x86-64"* | cli-native-linux-arm64-musl:*"ARM aarch64"*) ;;
              *)
                echo "Linux native addon has wrong architecture"
                exit 1
                ;;
            esac
            case "$artifact_info" in
              *"static-pie linked"* | *"statically linked"*)
                echo "musl Node addon must dynamically link libc"
                exit 1
                ;;
            esac
            if nm -a "artifacts/$package/formatjs_cli_napi.node" | grep 'init_have_lse_atomics' >/dev/null; then
              echo "musl Node addon must not run compiler-rt outline atomics init during dlopen"
              exit 1
            fi
            case "$package:$binary_info" in
              cli-native-linux-x64-musl:*"x86-64"* | cli-native-linux-arm64-musl:*"ARM aarch64"*) ;;
              *)
                echo "Linux CLI has wrong architecture"
                exit 1
                ;;
            esac
            case "$binary_info" in
              *"static-pie linked"* | *"statically linked"*) ;;
              *)
                echo "Linux release CLI should be a static musl binary"
                exit 1
                ;;
            esac
          done

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-cross-build-smoke
          path: artifacts
          retention-days: 7

  macos_smoke:
    name: macOS Smoke Tests
    needs: release_cross_build
    runs-on: macos-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Darwin Artifact
        uses: actions/download-artifact@v8
        with:
          name: release-cross-build-smoke
          path: artifacts

      - name: Rust CLI Smoke Test
        run: |
          chmod +x artifacts/formatjs_cli-darwin-arm64
          artifacts/formatjs_cli-darwin-arm64 --version
          artifacts/formatjs_cli-darwin-arm64 --help

      - name: Native Binding Smoke Test
        run: |
          node -e 'const native = require(process.argv[1]); const formatters = native.supportedBuiltinFormatters(); if (!formatters.includes("default")) throw new Error("Missing default formatter"); const output = native.compileMessages([{id: "hello", message: "Hello {name}", sourceFile: "smoke.json"}], {}); if (!output.includes("\"hello\"")) throw new Error(output); console.log(output);' ./artifacts/cli-native-darwin-arm64

  windows_smoke:
    name: Windows Smoke Tests
    needs: release_cross_build
    runs-on: windows-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Windows MSVC Artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-cross-build-smoke
          path: artifacts

      - name: Rust CLI Smoke Test
        run: |
          $binaryPath = Resolve-Path .\artifacts\formatjs_cli-win32-x64.exe
          & $binaryPath --version
          & $binaryPath --help

      - name: Native Binding Smoke Test
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pkgPath = Resolve-Path .\artifacts\cli-native-win32-x64
          $script = @'
          const fs = require('node:fs')
          const os = require('node:os')
          const path = require('node:path')
          const native = require(process.argv[2])

          const formatters = native.supportedBuiltinFormatters()
          if (!formatters.includes('default')) {
            throw new Error('Missing default formatter')
          }

          const messageDir = fs.mkdtempSync(path.join(os.tmpdir(), 'formatjs-cli-lib-'))
          const messageSubdir = path.join(messageDir, 'messages[prod]')
          fs.mkdirSync(messageSubdir)
          const messageFile = path.join(messageSubdir, 'primary.json')
          fs.writeFileSync(
            messageFile,
            JSON.stringify({
              hello: {
                message: 'Hello {name}',
                description: 'Smoke test message',
              },
            })
          )

          if (!messageFile.includes('\\')) {
            throw new Error(`Expected a native Windows path, got ${messageFile}`)
          }

          const output = native.compile([messageFile], {
            ast: true,
            format: 'crowdin',
          })
          const compiled = JSON.parse(output)
          if (!Array.isArray(compiled.hello)) {
            throw new Error(output)
          }
          console.log(output)

          const sourceSubdir = path.join(messageDir, 'src[prod]')
          fs.mkdirSync(sourceSubdir)
          const sourceFile = path.join(sourceSubdir, 'component.tsx')
          fs.writeFileSync(
            sourceFile,
            `
          import {defineMessage} from 'react-intl'

          defineMessage({
            id: 'native.extract',
            defaultMessage: 'Native extract smoke',
          })
          `
          )

          if (!sourceFile.includes('\\')) {
            throw new Error(`Expected a native Windows path, got ${sourceFile}`)
          }

          const extractedOutput = native.extract([sourceFile], {
            idInterpolationPattern: '[sha512:contenthash:base64:6]',
            throws: true,
          })
          const extracted = JSON.parse(extractedOutput)
          if (
            extracted['native.extract']?.defaultMessage !==
            'Native extract smoke'
          ) {
            throw new Error(extractedOutput)
          }
          console.log(extractedOutput)
          '@
          $script | node - $pkgPath

  validate-pnpm-lock:
    name: Validate pnpm-lock.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies with pnpm
        run: pnpm install --frozen-lockfile

  publish-test-status:
    needs: test
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      startsWith(github.ref_name, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      CHECK_STATE: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Publish Required Check Status
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$CHECK_STATE" \
            -f context=test \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Dispatched test workflow $CHECK_STATE"
