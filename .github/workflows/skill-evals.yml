name: Skill Evals

on:
  pull_request:
    paths:
      - '.agents/evals/**'
      - '.agents/skills/**'
      - '.github/workflows/skill-evals.yml'
  push:
    branches:
      - main
    paths:
      - '.agents/evals/**'
      - '.agents/skills/**'
      - '.github/workflows/skill-evals.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  copilot-requests: write

jobs:
  evaluate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        skill:
          - localization-review
          - translate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot@1.0.80

      - name: Evaluate ${{ matrix.skill }}
        env:
          COPILOT_MODEL: claude-sonnet-4.6
          GITHUB_TOKEN: ${{ github.token }}
          JS_BINARY__CHDIR: ${{ github.workspace }}
        run: |
          bazel run //.agents/evals:run -- \
            --skill ".agents/skills/${{ matrix.skill }}" \
            --suite ".agents/evals/cases/${{ matrix.skill }}.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --transcript ".skill-evals/${{ matrix.skill }}.jsonl"

      - name: Upload Transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-eval-${{ matrix.skill }}
          path: .skill-evals/${{ matrix.skill }}.jsonl
          if-no-files-found: warn
          retention-days: 7
