name: React Native Hermes Intl

on:
  pull_request:
    paths:
      - 'examples/react-native-hermes/**'
      - 'native/hermes/**'
      - 'crates/intl_*/**'
      - 'MODULE.bazel*'
      - '.github/workflows/react-native-hermes.yml'
      - '.github/scripts/react-native-hermes-e2e.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: hermes-android
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android toolchain
        run: |
          sdkmanager --install 'ndk;27.1.12297006' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Build Rust Android SDK
        run: |
          bazel build --extra_toolchains=@androidndk//:all --spawn_strategy=local //native/hermes/package:android_sdk
          mkdir -p "$RUNNER_TEMP/formatjs-hermes-sdk"
          tar -xzf bazel-bin/native/hermes/package/formatjs_intl_hermes_android-0.1.0.tar.gz -C "$RUNNER_TEMP/formatjs-hermes-sdk"
          echo "FORMATJS_HERMES_SDK=$RUNNER_TEMP/formatjs-hermes-sdk" >> "$GITHUB_ENV"
      - name: Install app dependencies
        working-directory: examples/react-native-hermes
        run: |
          npm ci
          npm run typecheck
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android screen E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/react-native-hermes-e2e.sh
      - name: Compare screenshot
        working-directory: examples/react-native-hermes
        env:
          VRT_DIFF: ${{ runner.temp }}/intl-screen-diff.png
        run: npm run vrt -- "$RUNNER_TEMP/intl-screen.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hermes-android-screen
          path: |
            ${{ runner.temp }}/intl-screen.png
            ${{ runner.temp }}/intl-screen-diff.png
            ${{ runner.temp }}/failure-screen.png
            ${{ runner.temp }}/android-logcat.txt
            ${{ runner.temp }}/window.xml
            examples/react-native-hermes/android/app/build/reports/androidTests/
