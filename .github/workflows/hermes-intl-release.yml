name: Hermes Intl SDK Release

on:
  pull_request:
    paths:
      - 'native/hermes/**'
      - 'crates/intl_*/**'
      - 'MODULE.bazel*'
      - '.bazelrc'
      - '.github/workflows/hermes-intl-release.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build SDK archives without publishing
        type: boolean
        default: true
      release_tag:
        description: Existing SDK tag to build instead of the selected workflow ref
        type: string
      apple_run_id:
        description: Reuse Apple archive from an SDK workflow run at the same commit
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-intl-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'formatjs-hermes-intl_v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: hermes-intl-sdk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager --install 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Build SDK archives
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          : "${BUILDBUDDY_ORG_API_KEY:?BuildBuddy credentials are required for SDK releases}"
          args=(
            --config=ci -c opt
            --remote_download_toplevel
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_ORG_API_KEY"
            --extra_toolchains=@androidndk//:all
          )
          targets=(//native/hermes/package:sdk //native/hermes/package:android_sdk)
          bazel build "${args[@]}" "${targets[@]}"
          mkdir artifacts
          for target in "${targets[@]}"; do
            archive=$(bazel cquery "${args[@]}" --output=files "$target")
            cp "$archive" artifacts/
          done
          cp native/hermes/version.txt artifacts/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-sdk
          path: artifacts/

  apple:
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'formatjs-hermes-intl_v')) && !inputs.apple_run_id
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: hermes-intl-apple-sdk
      - name: Build Apple SDK
        run: |
          bazel build -c opt --config=hermes-apple //native/hermes/package:apple_sdk
          archive=$(bazel cquery -c opt --config=hermes-apple --output=files //native/hermes/package:apple_sdk)
          mkdir artifacts
          cp "$archive" artifacts/
      - name: Verify Apple libraries
        run: |
          mkdir sdk
          tar -xmzf artifacts/formatjs-hermes-intl-apple.tar.gz -C sdk
          for triple in aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-ios x86_64-apple-darwin; do
            archive="sdk/lib/$triple/libformatjs_intl_hermes.a"
            test -s "$archive"
            xcrun lipo -info "$archive"
          done
      - name: Link Apple smoke executables
        run: |
          for platform in ios_arm64 ios_sim_arm64 ios_sim_x86_64 macos_arm64 macos_x86_64; do
            target="//native/hermes/package:${platform}_link_smoke"
            bazel build -c opt --config=hermes-apple "$target"
            executable=$(bazel cquery -c opt --config=hermes-apple --output=files "$target")
            xcrun vtool -show-build "$executable"
            if [[ "$platform" == "macos_$(uname -m)" ]]; then
              "$executable"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-apple-sdk
          path: artifacts/

  publish:
    needs: [build, apple]
    if: always() && needs.build.result == 'success' && (needs.apple.result == 'success' || inputs.apple_run_id != '') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Verify reused Apple archive source
        if: inputs.apple_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN_ID: ${{ inputs.apple_run_id }}
        run: |
          [[ "$APPLE_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLE_RUN_ID" \
            --jq 'select(.path == ".github/workflows/hermes-intl-release.yml") | .head_sha')
          test "$source_sha" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v8
        with:
          name: formatjs-hermes-intl-apple-sdk
          path: artifacts/
          run-id: ${{ inputs.apple_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: formatjs-hermes-intl-sdk
          path: artifacts/
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz version.txt > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-release
          path: artifacts/
      - name: Publish SDK archives
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          version=$(cat native/hermes/version.txt)
          test "$RELEASE_TAG" = "formatjs-hermes-intl_v$version"
          gh release view "$RELEASE_TAG" > /dev/null
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
