name: Hermes Intl SDK Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build SDK archives without publishing
        type: boolean
        default: true
      release_tag:
        description: Existing SDK tag to build instead of the selected workflow ref
        type: string
      apple_run_id:
        description: Reuse Apple archive from an SDK workflow run at the same commit
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-intl-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'formatjs-hermes-intl_v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: hermes-intl-sdk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager --install 'ndk;27.1.12297006'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Build SDK archives
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          : "${BUILDBUDDY_ORG_API_KEY:?BuildBuddy credentials are required for SDK releases}"
          args=(
            --config=ci -c opt
            --remote_download_toplevel
            --remote_header="x-buildbuddy-api-key=$BUILDBUDDY_ORG_API_KEY"
            --extra_toolchains=@androidndk//:all
          )
          targets=(//native/hermes/package:sdk //native/hermes/package:android_sdk //native/hermes/package:apple_sdk)
          bazel build "${args[@]}" "${targets[@]}"
          mkdir artifacts
          for target in "${targets[@]}"; do
            archive=$(bazel cquery "${args[@]}" --output=files "$target")
            cp "$archive" artifacts/
          done
          cp native/hermes/version.txt artifacts/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-sdk
          path: |
            artifacts/formatjs-hermes-intl-desktop.tar.gz
            artifacts/formatjs-hermes-intl-android.tar.gz
            artifacts/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-apple-sdk
          path: artifacts/formatjs-hermes-intl-apple.tar.gz

  apple:
    needs: build
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'formatjs-hermes-intl_v')) && !inputs.apple_run_id
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: formatjs-hermes-intl-apple-sdk
          path: artifacts/
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: hermes-intl-apple-consumer
      - name: Link Linux-built Apple SDK
        run: |
          mkdir sdk
          tar -xmzf artifacts/formatjs-hermes-intl-apple.tar.gz -C sdk
          bash examples/hermes-apple-sdk/smoke.sh "$PWD/sdk"

  publish:
    needs: [build, apple]
    if: always() && needs.build.result == 'success' && (needs.apple.result == 'success' || inputs.apple_run_id != '') && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Verify reused Apple archive source
        if: inputs.apple_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUN_ID: ${{ inputs.apple_run_id }}
        run: |
          [[ "$APPLE_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPLE_RUN_ID" \
            --jq 'select(.path == ".github/workflows/hermes-intl-release.yml") | .head_sha')
          test "$source_sha" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v8
        with:
          name: formatjs-hermes-intl-apple-sdk
          path: artifacts/
          run-id: ${{ inputs.apple_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: formatjs-hermes-intl-sdk
          path: artifacts/
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz version.txt > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: formatjs-hermes-intl-release
          path: artifacts/
      - name: Publish SDK archives
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          version=$(cat native/hermes/version.txt)
          test "$RELEASE_TAG" = "formatjs-hermes-intl_v$version"
          gh release view "$RELEASE_TAG" > /dev/null
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
