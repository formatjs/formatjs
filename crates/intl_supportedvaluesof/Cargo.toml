[package]
name = "formatjs_intl_supportedvaluesof"
version = "0.2.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "ECMA-402 supported value enumeration for FormatJS runtimes"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "conformance"
path = "conformance.rs"
