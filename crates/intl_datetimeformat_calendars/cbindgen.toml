language = "C"
cpp_compat = true
pragma_once = true
include_version = false
usize_is_size_t = true
documentation = true
style = "both"
sys_includes = ["formatjs/intl/datetimeformat.h"]

[export.rename]
"DateTimeRegistry" = "FormatjsDateTimeRegistry"

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]
