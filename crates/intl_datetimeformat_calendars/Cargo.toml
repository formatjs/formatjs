[package]
name = "formatjs_intl_datetimeformat_calendars"
version = "0.3.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Numeric calendar math and optional native DateTimeFormat providers"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[features]
default = ["provider"]
provider = ["dep:formatjs_intl_datetimeformat", "dep:serde", "dep:serde_json"]
compiled_data = ["provider"]

[dependencies]
formatjs_intl_datetimeformat = { path = "../intl_datetimeformat", version = "1.1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
