[package]
name = "formatjs_intl_datetimeformat_calendars"
version = "0.2.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Optional calendar providers for native DateTimeFormat"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[features]
compiled_data = []

[dependencies]
formatjs_intl_datetimeformat = { path = "../intl_datetimeformat", version = "0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
