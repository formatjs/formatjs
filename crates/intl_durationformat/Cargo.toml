[package]
name = "formatjs_intl_durationformat"
version = "0.1.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Native ECMA-402 DurationFormat records and formatting"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = false
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
[dev-dependencies]
serde_json = "1.0"
[[example]]
name = "conformance"
path = "conformance.rs"
