[package]
name = "formatjs_intl_durationformat"
version = "1.0.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Native ECMA-402 DurationFormat records and formatting"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true
[lib]
path = "lib.rs"
[features]
compiled_data = [
  "formatjs_intl_numberformat/compiled_data",
  "formatjs_intl_listformat/compiled_data",
]

[dependencies]
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales", version = "1.0.0" }
formatjs_intl_locale = { path = "../intl_locale", version = "1.0.0" }
formatjs_intl_numberformat = { path = "../intl_numberformat", version = "0.2.1" }
formatjs_intl_listformat = { path = "../intl_listformat", version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[[example]]
name = "conformance"
path = "conformance.rs"
