[package]
name = "formatjs_intl_datetimeformat"
version = "0.1.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "DateTimeFormat arithmetic and owned CLDR records"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = false

[lib]
path = "lib.rs"

[features]
compiled_data = []

[dependencies]
formatjs_intl_data = { path = "../intl_data" }
formatjs_intl_numberformat = { path = "../intl_numberformat" }
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales" }
formatjs_intl_locale = { path = "../intl_locale" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "civil_conformance"
path = "civil_conformance.rs"

[[example]]
name = "timezone_conformance"
path = "timezone_conformance.rs"

[[example]]
name = "pattern_conformance"
path = "pattern_conformance.rs"
