language = "C"
cpp_compat = true
pragma_once = true
include_version = false
usize_is_size_t = true
documentation = true
style = "both"

[export.rename]
"SegmenterHandle" = "FormatjsSegmenterHandle"
"SegmentsHandle" = "FormatjsSegmentsHandle"
"CursorHandle" = "FormatjsSegmentCursorHandle"
"SegmenterBytes" = "FormatjsSegmenterBytes"

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]
