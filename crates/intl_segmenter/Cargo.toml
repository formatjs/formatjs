[package]
name = "formatjs_intl_segmenter"
version = "1.0.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "ECMA-402 Segmenter using ICU4X and UTF-16 boundaries"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[dependencies]
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales", version = "1.0.0" }
formatjs_intl_locale = { path = "../intl_locale", version = "1.0.0" }
icu_locale_core = "2.3"
icu_segmenter = "2.3"
icu_properties = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "conformance"
path = "conformance.rs"
