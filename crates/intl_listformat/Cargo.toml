[package]
name = "formatjs_intl_listformat"
version = "0.1.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "ECMA-402 ListFormat with caller-loaded CLDR patterns"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = false

[lib]
path = "lib.rs"

[dependencies]
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales" }
formatjs_intl_locale = { path = "../intl_locale" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "conformance"
path = "conformance.rs"
