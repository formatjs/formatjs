[package]
name = "formatjs_intl_listformat"
version = "1.0.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "ECMA-402 ListFormat with caller-loaded CLDR patterns"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[features]
compiled_data = []

[dependencies]
formatjs_intl_data = { path = "../intl_data", version = "0.2.0" }
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales", version = "1.0.0" }
formatjs_intl_locale = { path = "../intl_locale", version = "1.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
icu_properties = "2.3"

[[example]]
name = "conformance"
path = "conformance.rs"
