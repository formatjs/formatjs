[package]
name = "formatjs_intl_locale"
version = "0.1.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "ECMA-402 Locale using ICU4X canonicalization and CLDR preferences"
license = "BSD-3-Clause"
repository = "https://github.com/formatjs/formatjs"
publish = true

[lib]
path = "lib.rs"

[dependencies]
formatjs_intl_getcanonicallocales = { path = "../intl_getcanonicallocales", version = "0.1.0" }
icu_locale = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "conformance"
path = "conformance.rs"
