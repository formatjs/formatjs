[package]
name = "formatjs_intl_hermes"
version = "0.1.0"
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Rust C ABI assembly for FormatJS Hermes extensions"
