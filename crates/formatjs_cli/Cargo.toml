[package]
name = "formatjs_cli"
version = "1.8.3"
publish = false
edition = "2024"
authors = ["FormatJS Team", "Long Ho <holevietlong@gmail.com>"]
description = "Command-line interface for FormatJS - A Rust-based CLI for internationalization"
license = "MIT"
repository = "https://github.com/formatjs/formatjs"
homepage = "https://formatjs.io/"
documentation = "https://docs.rs/formatjs_cli"
keywords = ["icu", "i18n", "internationalization", "cli", "intl"]
categories = ["internationalization", "command-line-utilities", "localization"]
readme = "README.md"
rust-version = "1.97"

[[bin]]
name = "formatjs"
path = "main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
fast-glob = "1.0"
walkdir = "2"
formatjs_icu_messageformat_parser = { path = "../icu_messageformat_parser", version = "1.1.1" }
formatjs_apple_printf_parser = { path = "../apple_printf_parser", version = "0.1.0" }
formatjs_java_printf_parser = { path = "../java_printf_parser", version = "0.1.0" }
formatjs_icu_skeleton_parser = { path = "../icu_skeleton_parser", version = "0.1.2" }
oxc = { version = "0.155", features = ["ast_visit", "semantic"] }
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_data_structures = { version = "0.155", features = ["rope"] }
oxc_parser = "0.155"
oxc_span = "0.155"
oxc_ecmascript = { version = "0.155", features = ["constant_evaluation"] }
oxc_syntax = "0.155"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
base64 = "0.23"
hex = "0.4"
rayon = "1.12"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "3.0", features = ["full", "parsing", "visit"] }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.2" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.17.2" }

[dev-dependencies]
tempfile = "3.0"

[lib]
path = "lib.rs"
