language = "C"
cpp_compat = true
pragma_once = true
include_version = false
usize_is_size_t = true
documentation = true
style = "both"

[export.rename]
"DisplayRegistry" = "FormatjsDisplayRegistry"
"DisplayHandle" = "FormatjsDisplayHandle"
"DisplayBytes" = "FormatjsDisplayBytes"

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]
